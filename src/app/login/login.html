<ion-content [fullscreen]="true">

  <div class="login-page">

    <!-- Login Card -->
    <div class="login-card">

      <!-- Header -->
      <div class="login-header">

        <h1>Welcome Back!</h1>

        <p>
          Login to continue your fitness journey.
        </p>

      </div>


      <!-- Fitness Image -->
     <div class="fitness-image">
  <img
    src="https://i.pinimg.com/474x/27/34/8a/27348aac7e3728ffb7e0010b48265e0e.jpg"
    alt="Fitness workout"
  />
</div>


      <!-- Email -->
      <div class="input-group">

        <label>Email Address</label>

        <div class="input-box">

          <ion-icon name="mail-outline"></ion-icon>

          <ion-input
            type="email"
            placeholder="Enter your email">
          </ion-input>

        </div>

      </div>


      <!-- Password -->
      <div class="input-group">

        <div class="password-header">

          <label>Password</label>

          <button type="button">
            Forgot Password?
          </button>

        </div>

        <div class="input-box">

          <ion-icon name="lock-closed-outline"></ion-icon>

          <ion-input
            type="password"
            placeholder="Enter your password">
          </ion-input>

          <ion-icon
            class="eye-icon"
            name="eye-outline">
          </ion-icon>

        </div>

      </div>


      <!-- Login Button -->
      <ion-button
        expand="block"
        class="login-button">

        Login

        <ion-icon
          slot="end"
          name="arrow-forward-outline">
        </ion-icon>

      </ion-button>


      <!-- Divider -->
      <div class="divider">

        <span></span>

        <p>OR</p>

        <span></span>

      </div>


      <!-- Google -->
      <ion-button
        expand="block"
        fill="outline"
        class="google-button">

        <ion-icon
          slot="start"
          name="logo-google">
        </ion-icon>

        Continue with Google

      </ion-button>


      <!-- Sign Up -->
      <div class="signup">

        <span>
          Don't have an account?
        </span>

        <button type="button">
          Sign Up
        </button>

      </div>

    </div>


    <!-- Footer -->
    <div class="footer">
      © 2026 GYM APP. All rights reserved.
    </div>

  </div>

</ion-content>
